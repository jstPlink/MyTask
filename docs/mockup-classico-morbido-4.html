<!doctype html><html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup: stile morbido, quarto giro</title><style>
:root[data-theme=light]{--bg:#F1F0EC;--surface:#fff;--surface2:#E3E1DC;--ink:#2a2a2e;--mid:#65656E;--soft:#919199;--line:#DDDAD4;--accent:#2F7D5B;--accent-soft:#E3F1EA;--on:#fff;--p1:#8A93A0;--p2:#D9A400;--p3:#D32F2F;--warn:#D1430B;--shadow:0 6px 20px rgba(30,30,40,.10);--page:#E7E5DF;--sh:30,30,40}
:root[data-theme=dark]{--bg:#0E0F12;--surface:#1D1F23;--surface2:#272930;--ink:#F3F3F6;--mid:#A5A5B0;--soft:#72737D;--line:#2F3138;--accent:#6FCF9B;--accent-soft:#17332A;--on:#0E0F12;--p1:#7B8493;--p2:#F4C542;--p3:#FF6B6B;--warn:#FF9466;--shadow:0 6px 24px rgba(0,0,0,.55);--page:#050506;--sh:0,0,0}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{padding:20px 24px 40px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mid);margin:0 0 4px;max-width:880px}.tg{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface);color:var(--ink);margin-left:6px}
.row6{display:flex;gap:26px;overflow-x:auto;padding:18px 4px 24px;align-items:flex-start}
.cell{flex:none;width:393px}.cell h2{font-size:15px;margin:0 0 2px}.cell p{font-size:12.5px;color:var(--mid);margin:0 0 10px;min-height:54px}
.ph{position:relative;width:393px;height:790px;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.top{padding:22px 18px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{font-size:26px;font-weight:750;letter-spacing:-.015em;line-height:1.15;margin:0}.date{font-size:12.5px;color:var(--mid);margin-top:3px}
.circs{display:flex;gap:8px}.circ{width:44px;height:44px;border-radius:50%;background:var(--cbg);color:var(--cink);box-shadow:inset 0 0 0 1px var(--cbd);display:grid;place-items:center;position:relative}.circ svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.circ i{position:absolute;top:-3px;right:-3px;min-width:21px;height:21px;border-radius:999px;background:var(--accent);color:var(--on);font:700 11px/21px system-ui;font-style:normal;text-align:center;border:2px solid var(--bg)}
.scroll{flex:1;overflow:hidden;padding:0 14px}
.fab{position:absolute;right:18px;bottom:90px;width:62px;height:62px;border-radius:20px;background:var(--accent);color:var(--on);font-size:34px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow)}
/* barra delle schede: staccata dallo sfondo con l'ombra, niente filetto */
.tabs{display:flex;gap:4px;padding:0 6px;background:var(--surface);height:64px;border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(var(--sh),.13),0 -1px 3px rgba(var(--sh),.07);position:relative;z-index:2}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--soft);font-size:10.5px;font-weight:600}
.tabs .tab-in{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px 3px;border-radius:16px;border:1px solid transparent}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--cink);font-weight:700}.tabs button.on .tab-in{background:var(--cbg);box-shadow:inset 0 0 0 1px var(--cbd);border-color:transparent;border-radius:18px}
.acc{display:flex;justify-content:space-between;align-items:center;border-radius:18px;padding:10px 14px;margin:4px 0 6px;background:var(--rowbg);box-shadow:var(--rowsh)}.acc b{font:800 24px/1.1 ui-monospace,Consolas,monospace;color:var(--accent)}.acc .t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);font-weight:700}.acc .s{font-size:12px;color:var(--mid)}
.sez{margin-top:14px}.sez h3{margin:0 4px 7px;font-size:14px;font-weight:700;color:var(--mid);display:flex;gap:8px}.sez h3 b{margin-left:auto;font-weight:600}
/* riga: titolo e contenuto; a destra freccia di priorità (punta il titolo) e casella */
.row{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 14px;margin-bottom:8px;border-radius:16px;background:var(--rowbg);box-shadow:var(--rowsh)}.row .g{flex:1;min-width:0}.t1{font-size:15px;font-weight:620}.t2{font-size:12px;color:var(--mid);margin-top:1px}
.cb{width:var(--sz);height:var(--sz);flex:none;border:2px solid var(--soft);border-radius:calc(var(--sz)*.3);display:grid;place-items:center}.cb.go{border-color:var(--ink)}.cb.go::after{content:"";width:calc(var(--sz)*.38);height:calc(var(--sz)*.38);border-radius:50%;background:var(--ink)}
.l1{--c:var(--p1)}.l2{--c:var(--p2)}.l3{--c:var(--p3)}
.tg0{position:relative;width:var(--sz);height:var(--sz);flex:none;display:grid;place-items:center;padding-left:4px;color:var(--c);font-weight:900;font-size:calc(var(--sz)*.54)}.tg0 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.tg0 path{fill:color-mix(in srgb,var(--c) 16%,transparent);stroke:var(--c);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}.tg0 b{position:relative}.l1 .tg0 path{fill:var(--surface2)}
.int{width:30px;height:30px;border-radius:50%;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:grid;place-items:center;font-weight:900;font-size:15.5px;flex:none}.int.cg{--c:#1F7A52}.int.cz{--c:var(--p1);background:var(--surface2)}
/* scadenza e timer dentro la riga */
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;color:var(--mid)}.due svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.due.late{color:var(--warn)}.due.soon{color:var(--accent)}
.meta{display:flex;gap:8px;align-items:center;margin-top:2px;font-size:12px;color:var(--mid)}
.timer{margin-top:6px}.timer .tt{display:flex;justify-content:space-between;font:700 12px ui-monospace,Consolas,monospace;color:var(--ink)}.timer .tt span{color:var(--mid);font-weight:600}.bar{height:var(--bh);border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--barc);border-radius:3px}
/* progetto: header più piccolo, colorato, con divisorio dalle note */
.proj{margin:0 0 8px;border-radius:18px;overflow:hidden;background:var(--rowbg);box-shadow:var(--rowsh)}
.proj .ph2{display:flex;gap:8px;align-items:center;padding:7px 14px;font-weight:700;font-size:12.5px;background:var(--hbg);color:var(--hink);border-bottom:1px solid var(--hdiv)}.proj .ph2 span{margin-left:auto;font-size:11.5px;font-weight:700;opacity:.8}.proj .ph2 svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.proj .row{margin:0;border-radius:0;background:none;box-shadow:none;padding:9px 12px 9px 14px}.proj .row+.row{border-top:1px solid var(--line)}
/* ============ varianti ============ */
.pn{--sz:28px;--bh:3px;--barc:var(--ink);--cbg:var(--surface2);--cink:var(--ink);--cbd:color-mix(in srgb,var(--ink) 12%,transparent);--rowsh:0 3px 14px rgba(var(--sh),.15);--hink:var(--ink);--hdiv:transparent}
.pn .tabs{background:var(--rowbg)}
.v1{--rowbg:color-mix(in srgb,var(--surface) 25%,var(--bg));--hbg:var(--surface2)}
.v2{--rowbg:color-mix(in srgb,var(--surface) 35%,var(--bg));--hbg:color-mix(in srgb,var(--ink) 10%,var(--surface2))}
.v3{--rowbg:color-mix(in srgb,var(--surface) 45%,var(--bg));--hbg:color-mix(in srgb,var(--accent) 22%,var(--surface2));--hink:color-mix(in srgb,var(--accent) 70%,var(--ink))}
.v4{--rowbg:color-mix(in srgb,var(--surface) 30%,var(--bg));--hbg:color-mix(in srgb,var(--ink) 22%,var(--surface2))}
.v5{--rowbg:color-mix(in srgb,var(--surface) 55%,var(--bg));--hbg:var(--accent-soft);--hink:var(--accent)}
.v6{--rowbg:color-mix(in srgb,var(--surface) 40%,var(--bg));--hbg:color-mix(in srgb,var(--ink) 34%,var(--surface2));--hink:#fff}
</style></head><body><div class="wrap"><h1>Stile «Morbido», quarto giro</h1><p class="sub">Fissati: controlli grigi con filetto, ombra forte, freccia e casella da 28 px, timer sottile senza colore. Qui si provano le righe con tonalità più vicine allo sfondo e il colore della testata del progetto. <button class="tg" onclick="var d=document.documentElement;d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'light':'dark')">Chiaro / scuro</button></p>
<div class="row6" id="g"></div></div>
<script>
const ARROW='M26 1.6 H10 L2.4 13 Q1 16 2.4 19 L10 30.4 H26 Q30.4 30.4 30.4 26 V6 Q30.4 1.6 26 1.6 Z';
const ic={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',chk:'<rect x="3.5" y="4" width="17" height="16" rx="4.5"/><path d="M8 12.2l3 3 5-6"/>',cmp:'<circle cx="12" cy="12" r="9"/><path d="M15.8 8.2l-2.1 5.5-5.5 2.1 2.1-5.5z"/>',bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',rep:'<path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',inb:'<path d="M3.5 13.5L6.2 5.6A1.5 1.5 0 0 1 7.6 4.5h8.8a1.5 1.5 0 0 1 1.4 1.1l2.7 7.9"/><path d="M3.5 13.5v4.2a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-4.2h-5.2l-1 2.2H9.7l-1-2.2z"/>',dots:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',fold:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>'};
const S=k=>`<svg viewBox="0 0 24 24">${ic[k]}</svg>`;
const tag=n=>`<span class="tg0"><svg viewBox="0 0 32 30" preserveAspectRatio="none"><path d="${ARROW}"/></svg><b>${n}</b></span>`;
const due=(txt,k)=>`<span class="due ${k||''}">${S('cal')}${txt}</span>`;
const row=(l,n,t,meta,opt={})=>`<div class="row l${l}"><div class="g"><div class="t1">${t}</div>${opt.timer?'':`<div class="meta">${meta}</div>`}${opt.timer?`<div class="timer"><div class="tt">00:24:10<span>/ 1 h</span></div><div class="bar"><i style="width:40%"></i></div></div>`:''}</div>${tag(n)}<span class="cb ${opt.go?'go':''}"></span></div>`;
const cur=(c,n,t,m)=>`<div class="row"><div class="g"><div class="t1">${t}</div><div class="meta">${m}</div></div><span class="int ${c}">${n}</span><span class="cb"></span></div>`;
const proj=`<div class="proj"><div class="ph2">Trasloco<span>1 / 3</span></div>${row(2,4,'Contratto della luce','prossimo passo · '+due('tra 5 giorni'))}${row(1,5,'Prenotare il furgone','1 h')}</div>`;
const body=`<div class="acc"><div><div class="t">Correzione alle tue stime</div><div class="s">Stime centrate</div></div><b>+4%</b></div>
<div class="sez"><h3>Attività<b>5</b></h3>${row(3,1,'Pagare la bolletta','20 min · '+due('domani','soon'))}${row(2,2,'Preparare la riunione','',{timer:1,go:1})}${row(3,3,'Chiamare il commercialista','15 min · '+due('scaduta ieri','late'))}${proj}</div>
<div class="sez"><h3>Curiosità<b>2</b></h3>${cur('cg',1,'Documentario sulle api','45 min')}</div>`;
const tabs=`<nav class="tabs"><button class="on"><span class="tab-in">${S('sun')}<span>Priorità</span></span></button><button><span class="tab-in">${S('chk')}<span>Attività</span></span></button><button><span class="tab-in">${S('cmp')}<span>Intratt.</span></span></button><button><span class="tab-in">${S('bulb')}<span>Curiosità</span></span></button><button><span class="tab-in">${S('rep')}<span>Routine</span></span></button></nav>`;
const testa=`<div class="top"><div><h1 class="title">Priorità</h1><div class="date">venerdì 20 novembre</div></div><div class="circs"><span class="circ">${S('moon')}</span><span class="circ">${S('inb')}<i>3</i></span><span class="circ">${S('dots')}</span></div></div>`;
const phone=v=>`<div class="ph pn ${v}">${testa}<div class="scroll">${body}</div><span class="fab">+</span>${tabs}</div>`;
const V=[
['v1','1 · Righe 25%, testata come i pulsanti','Sfondo righe appena più chiaro del fondo (25% di bianco); testata del progetto nello stesso grigio dei pulsanti in alto.'],
['v2','2 · Righe 35%, testata un grado più scura','Righe al 35%; testata del pulsante grigio con un 10% di scuro in più, testo scuro.'],
['v3','3 · Righe 45%, testata grigio-verde','Righe al 45%; testata grigia con un velo del verde d’accento (22%), testo verde scuro: resta nella palette.'],
['v4','4 · Righe 30%, testata grigio medio','Righe al 30%; testata grigia al 22% di scuro, testo scuro: più marcata ma sempre calda.'],
['v5','5 · Righe 55%, testata verde chiaro','Righe al 55%; testata nella tinta verde tenue dell’accento (la stessa della pillola attiva di prima), testo verde.'],
['v6','6 · Righe 40%, testata grigio scuro','Righe al 40%; testata grigia al 34% di scuro con testo bianco, la più forte.']
];
document.getElementById('g').innerHTML=V.map(([k,t,d])=>`<div class="cell"><h2>${t}</h2><p>${d}</p>${phone(k)}</div>`).join('');
</script></body></html>
