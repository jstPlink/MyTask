<!doctype html><html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup: simbolo più compatto</title><style>
:root[data-theme=light]{--bg:#F1F0EC;--surface:#fff;--surface2:#E3E1DC;--ink:#111115;--mid:#65656E;--soft:#919199;--line:#DDDAD4;--p1:#8A93A0;--p2:#D9A400;--p3:#D32F2F;--g1:#8A93A0;--g3:#4E9A78;--g5:#1F7A52}
:root[data-theme=dark]{--bg:#0E0F12;--surface:#1D1F23;--surface2:#272930;--ink:#F3F3F6;--mid:#A5A5B0;--soft:#72737D;--line:#2F3138;--p1:#7B8493;--p2:#F4C542;--p3:#FF6B6B;--g1:#7B8493;--g3:#5FAE8D;--g5:#6FCF9B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mid);margin:0 0 18px}
.tg{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px 10px}
.card h2{font-size:13px;margin:10px 0 2px}.card h2 small{font-weight:500;color:var(--mid)}.card p{font-size:12px;color:var(--mid);margin:0 0 4px}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:var(--c)}.row:last-child{border:0}
.row .t{flex:1;min-width:0;color:var(--ink)}.row .t b{display:block;font-size:14px}.row .t span{font-size:12px;color:var(--mid)}
.sep{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:8px 0 0}
.slot{width:var(--tot);flex:none;display:flex;justify-content:flex-start;align-items:center}
.grp{display:inline-flex;align-items:center;flex:none}
.sv{display:block;overflow:visible;flex:none}.sv text{font-family:system-ui;font-weight:900;text-anchor:middle}
.p1{--c:var(--p1);--on:#fff}.p2{--c:var(--p2);--on:#1b1500}.p3{--c:var(--p3);--on:#fff}.g1{--c:var(--g1);--on:#fff}.g3{--c:var(--g3);--on:#fff}.g5{--c:var(--g5);--on:#fff}
.bar{height:5px;border-radius:3px;background:var(--c);opacity:.35;margin:4px 0 0}
</style></head><body><div class="wrap"><h1>Simbolo più compatto</h1><p class="sub">Stesso stile diviso (simbolo al 45%, numero al 22%) ma con il pezzo del «!» e del «?» che occupa meno spazio: più stretto, fessura ridotta, glifo più piccolo, fino alla sovrapposizione. Dopo il titolo di ogni scheda trovi la larghezza totale della targhetta (oggi 59 px). <button class="tg" onclick="var d=document.documentElement;d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'light':'dark')">Chiaro / scuro</button></p><div class="grid" id="g"></div></div>
<script>
const H=30;
const leftP=(w,h=H,r=5)=>`M${r} 1 H${w-.5} V${h-1} H${r} Q1 ${h-1} 1 ${h-r} V${r} Q1 1 ${r} 1 Z`;
const rightTag=(w,h=H,tip=9)=>`M.5 1 H${w-tip-1} L${w-3.5} ${h/2-3.2} Q${w-1} ${h/2} ${w-3.5} ${h/2+3.2} L${w-tip-1} ${h-1} H.5 Z`;
const rightPill=(w,h=H)=>{const r=h/2-1;return `M.5 1 H${w-1-r} A${r} ${r} 0 0 1 ${w-1-r} ${h-1} H.5 Z`};
const svg=(w,h,inner)=>`<svg class="sv" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
function fillOf(f,lvl){if(f==='solid')return{fill:'var(--c)',solid:true};if(lvl===1)return{fill:'var(--surface2)'};return{fill:`color-mix(in srgb,var(--c) ${f}%,transparent)`}}
const piece=(path,w,h,f,lvl,label,x,fs)=>{const a=fillOf(f,lvl);return svg(w,h,`<path d="${path}" fill="${a.fill}" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="${x}" y="${h/2+fs*.36}" style="font-size:${fs}px;fill:${a.solid?'var(--on)':'currentColor'}">${label}</text>`)};
/* p: sw larghezza simbolo, sh altezza simbolo, fs corpo del glifo, gap fessura (può essere negativo = sovrapposizione), nw larghezza numero */
function build(p){const sw=p.sw,sh=p.sh??30,fs=p.fs,gap=p.gap,nwA=p.nw??34,nwC=(p.nw??34)-2;
  const tot=sw+gap+nwA;
  const f=(k,s,n,lvl)=>{const a=k==='a';const rr=Math.min(a?5:14,sw-2);const nw=a?nwA:nwC;
    const sym=piece(leftP(sw,sh,rr),sw,sh,p.fa??45,lvl,s,sw/2+.5,fs);
    const num=piece(a?rightTag(nw):rightPill(nw),nw,H,22,lvl,n,a?(nw-4)/2:nw/2,15.5);
    return `<span class="slot" style="--tot:${tot}px"><span class="grp">${sym}<span style="margin-left:${gap}px;display:inline-block">${num}</span></span></span>`};
  f.tot=tot;return f}
const V=[
['1 · Com’è oggi','Simbolo 22 px, fessura 3 px, glifo 14.',{sw:22,gap:3,fs:14}],
['2 · Simbolo 18','Un po’ più stretto, glifo 13.',{sw:18,gap:3,fs:13}],
['3 · Simbolo 16, fessura 2','Glifo 12.',{sw:16,gap:2,fs:12}],
['4 · Simbolo 14, fessura 2','Glifo 11,5: compatto ma ancora un pezzo vero.',{sw:14,gap:2,fs:11.5}],
['5 · Simbolo 12, fessura 2','Glifo 11: quasi una linguetta.',{sw:12,gap:2,fs:11}],
['6 · Simbolo 14, fessura 1','Pezzi quasi uniti.',{sw:14,gap:1,fs:11.5}],
['7 · Simbolo 14, senza fessura','Pezzi attaccati: resta solo il bordo comune.',{sw:14,gap:0,fs:11.5}],
['8 · Simbolo 10','Glifo 10: una linguetta stretta.',{sw:10,gap:2,fs:10}],
['9 · Simbolo basso','Simbolo alto 20 px invece di 30, centrato: occupa meno anche in altezza.',{sw:16,sh:20,gap:2,fs:12}],
['10 · Sovrapposto di 3 px','Il simbolo entra sotto il bordo del numero.',{sw:16,gap:-3,fs:12}],
['11 · Simbolo 14, numero 30','Anche il numero si stringe: targhetta come l’originale a 44 px.',{sw:14,gap:2,fs:11.5,nw:30}],
['12 · Simbolo 16 quasi pieno','Simbolo stretto ma più saturo (60%) per restare leggibile.',{sw:16,gap:2,fs:12,fa:60}]
];
const att=[['Pagare la bolletta','domani','p3',3],['Preparare la riunione','1 h','p2',2],['Riordinare la scrivania','30 min','p1',1]];
const cur=[['Documentario sulle api','45 min','g5',3],['Capire come funzionano i bit','20 min','g3',2],['Podcast sui treni','1 h','g1',1]];
document.getElementById('g').innerHTML=V.map(([t,d,p])=>{const f=build(p);return `<div class="card"><h2>${t} <small>— totale ${f.tot} px</small></h2><p>${d}</p><div class="sep">Attività</div>${att.map((r,i)=>`<div class="row ${r[2]}">${f('a','!',i+1,r[3])}<span class="t"><b>${r[0]}</b><span>${r[1]}</span></span></div>`).join('')}<div class="sep">Curiosità</div>${cur.map((r,i)=>`<div class="row ${r[2]}">${f('c','?',i+1,r[3])}<span class="t"><b>${r[0]}</b><span>${r[1]}</span></span></div>`).join('')}</div>`}).join('');
</script></body></html>
