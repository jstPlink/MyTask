name: mytask

services:
  mytask:
    # Immagine già pronta, costruita da GitHub a ogni aggiornamento (vedi .github/workflows/docker.yml).
    # Se Docker non riesce a scaricarla, la costruisce dai file di questa cartella (serve il Dockerfile).
    image: ghcr.io/jstplink/mytask:latest
    build: .
    container_name: mytask
    restart: unless-stopped
    ports:
      # Porta sul NAS (a cui punta il Cloudflare Tunnel). Cambiala con MYTASK_PORT nel file .env.
      - "${MYTASK_PORT:-8787}:8787"
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "true"   # dietro Cloudflare Tunnel: legge l'IP reale per il limite ai tentativi di accesso
    volumes:
      # Il database vive in un volume Docker: parte con i permessi giusti (il container non gira come root).
      - mytask-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  mytask-data:
