<!doctype html><html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup: etichetta, varianti</title><style>
:root[data-theme=light]{--bg:#F1F0EC;--surface:#fff;--surface2:#E3E1DC;--ink:#111115;--mid:#65656E;--soft:#919199;--line:#DDDAD4;--warn:#D1430B;--warn-soft:#FDEBE2;--amber:#B7791F;--amber-soft:#FBEBD0;--accent:#2F7D5B}
:root[data-theme=dark]{--bg:#0E0F12;--surface:#1D1F23;--surface2:#272930;--ink:#F3F3F6;--mid:#A5A5B0;--soft:#72737D;--line:#2F3138;--warn:#FF9466;--warn-soft:#3A2218;--amber:#F0B866;--amber-soft:#3A2C14;--accent:#6FCF9B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mid);margin:0 0 18px}
.tg{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px 10px}
.card h2{font-size:13px;margin:10px 0 2px}.card p{font-size:12px;color:var(--mid);margin:0 0 6px}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14px}.row .t span{font-size:12px;color:var(--mid)}
.l1{--c:var(--soft);--cs:var(--surface2)}.l2{--c:var(--amber);--cs:var(--amber-soft)}.l3{--c:var(--warn);--cs:var(--warn-soft)}


.sv{flex:none;color:var(--c)}.sv text{font-family:system-ui;text-anchor:middle;fill:currentColor}
.card h2 small{font-weight:500;color:var(--mid)}
.nota{color:var(--mid);font-size:12px;margin:0 0 14px}
</style></head><body><div class="wrap"><h1>Etichetta: saturazione, bordo, dimensione</h1><p class="sub">Tutte derivano dalla prova 4 (bordo + fondo tenue, punta a destra). Sotto ogni titolo i valori usati. <button class="tg" onclick="var d=document.documentElement;d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'light':'dark')">Chiaro / scuro</button></p><div class="grid" id="g"></div></div>
<script>
const righe=[[1,'Pagare la bolletta','domani',3],[2,'Chiamare il commercialista','20 min',3],[3,'Preparare la riunione','1 h',2],[4,'Ordinare le lenti','5 min',2],[5,'Riordinare la scrivania','30 min',1]];
/* p: w,h = dimensioni; sw = bordo; fill = % di colore nel fondo; tip = lunghezza della punta; fs = corpo del numero; r = raggio angoli.
   Ogni parametro può essere un numero o una lista [basso, medio, alto] per farlo salire col livello. */
const pick=(x,l)=>Array.isArray(x)?x[l-1]:x;
function tag(p,l){
  const w=pick(p.w,l),h=pick(p.h,l),sw=pick(p.sw,l),fill=pick(p.fill,l),tip=pick(p.tip,l),fs=pick(p.fs,l),r=p.r??5;
  const q=sw/2+.4,x0=q,y0=q,x1=w-q,y1=h-q,ym=h/2,xt=x1-tip;
  const d=`M${x0+r} ${y0} H${xt} L${x1-3.2} ${ym-3.2} Q${x1} ${ym} ${x1-3.2} ${ym+3.2} L${xt} ${y1} H${x0+r} Q${x0} ${y1} ${x0} ${y1-r} V${y0+r} Q${x0} ${y0} ${x0+r} ${y0} Z`;
  const bg=l==1?'var(--surface2)':`color-mix(in srgb, currentColor ${fill}%, transparent)`;
  const col=l==1?'var(--mid)':'currentColor';
  return `<svg class="sv" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="${l==1?'color:var(--soft)':''}"><path d="${d}" fill="${bg}" stroke="${l==1?'var(--soft)':'currentColor'}" stroke-width="${sw}" stroke-linejoin="round"/><text x="${(x0+xt+4)/2+1}" y="${ym+fs*.36}" style="font-size:${fs}px;font-weight:${p.fw||800};${l==1?'fill:var(--mid)':''}">__N__</text></svg>`;
}
const B={w:40,h:32,sw:2,fill:16,tip:10,fs:13};
const v=[
['1','Base (prova 4)','fondo 16% · bordo 2 · 40×32',B],
['2','Fondo molto tenue','fondo 7% · bordo 2',{...B,fill:7}],
['3','Fondo medio','fondo 30% · bordo 2',{...B,fill:30}],
['4','Fondo forte','fondo 52% · bordo 2',{...B,fill:52}],
['5','Saturazione che sale col livello','fondo 8 → 22 → 42%',{...B,fill:[0,22,42].map((x,i)=>i?x:8)}],
['6','Bordo sottile','bordo 1,2',{...B,sw:1.2}],
['7','Bordo spesso','bordo 3,2',{...B,sw:3.2}],
['8','Bordo e fondo crescono insieme','bordo 1,4→2,2→3,2 · fondo 8→22→40%',{...B,sw:[1.4,2.2,3.2],fill:[8,22,40]}],
['9','Piccola','30×24 · numero 11',{...B,w:30,h:24,tip:8,fs:11,sw:1.6,r:4}],
['10','Grande','50×40 · numero 16',{...B,w:50,h:40,tip:13,fs:16,sw:2.4,r:6}],
['11','Dimensione che sale col livello','32×26 → 40×32 → 50×40',{...B,w:[32,40,50],h:[26,32,40],tip:[8,10,13],fs:[11,13,16]}],
['12','Punta lunga (più freccia)','punta 17 · 46×32',{...B,w:46,tip:17}],
['13','Punta corta','punta 5 · 36×32',{...B,w:36,tip:5}],
['14','Angoli molto stondati','raggio 10 · fondo 20%',{...B,r:10,fill:20}],
['15','Tutto insieme: sale col livello','dimensione + bordo + fondo',{w:[32,40,50],h:[26,32,40],sw:[1.4,2.2,3.2],fill:[8,22,42],tip:[8,10,13],fs:[11,13,16]}],
['16','Numero sottile','peso 600 · fondo 14%',{...B,fw:600,fill:14,fs:14}]
];
const lv=['','l1','l2','l3'];
document.getElementById('g').innerHTML=v.map(([k,t,d,p])=>`<div class="card"><h2>${k} · ${t} <small>— ${d}</small></h2>${righe.map(r=>`<div class="row ${lv[r[3]]}" style="min-height:${p.h?Math.max(...[].concat(p.h))+22:54}px">${tag(p,r[3]).replace('__N__',r[0])}<span class="t"><b>${r[1]}</b><span>${r[2]}</span></span></div>`).join('')}</div>`).join('');
</script></body></html>
