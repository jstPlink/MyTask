name: Test, immagine Docker e installer Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  immagine:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nome e versione dell'immagine
        id: info
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.info.outputs.image }}:latest
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.info.outputs.version }}

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Versione
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Costruisce l'installer
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --publish never -c.extraMetadata.version=${{ steps.v.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: mytask-windows
          path: desktop/dist/MyTask-v${{ steps.v.outputs.version }}.exe

      - name: Aggiunge l'installer alla release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          FILE=desktop/dist/MyTask-v${{ steps.v.outputs.version }}.exe
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "MyTask ${{ steps.v.outputs.version }}" \
              --notes "Installer per Windows della versione ${{ steps.v.outputs.version }}. L'app Android (APK) non si costruisce su GitHub: la costruisce Claude in locale e la installa sul telefono."
          fi
